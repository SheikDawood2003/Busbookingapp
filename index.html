<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <title>Form Validation</title>
</head>

<body>

    <div class="register-form">
        <div class="container">
            <div class="row register-row">
                <div class="col-7 register-col-2">
                    <div class="card">
                        <form action="" onsubmit="return formvalidate()" onreset="reseterror()">
                            <div class="register-form-enter-details" id="form-input">
                                <h2 class="text-center heading">Bus Ticket Booking Form</h2>
                                <div class="row">
                                    <div class="col-4">
                                        <label for="">First Name :</label>
                                        <input type="text" class="form-control" oninput="validate()" id="fname-input" placeholder="Enter Your First Name">
                                        <span class="error" id="fname-error"></span>
                                    </div>
                                    <div class="col-4">
                                        <label for="">Last Name :</label>
                                        <input type="text" class="form-control" oninput="validate()" id="lname-input" placeholder="Enter Your Last Name">
                                        <span class="error" id="lname-error"></span>
                                    </div>
                                    <div class="col-4">
                                        <label for="">Gender :</label>
                                        <select name="" id="gender-input" oninput="validate()" class="form-control">
                                            <option value="Select">Select</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                        </select>
                                        <span class="error" id="gender-error"></span>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <label for="">Email :</label>
                                        <input type="email" class="form-control" oninput="validate()" id="email-input" placeholder="Enter Your Email">
                                        <span class="error" id="email-error"></span>
                                    </div>
                                    <div class="col-6">
                                        <label for="">Phone Number :</label>
                                        <input type="number" class="form-control" oninput="validate()" id="phone-input" placeholder="Enter Your Phone Number">
                                        <span class="error" id="number-error"></span>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-4">
                                        <label for="">From :</label>
                                        <input type="text" class="form-control" oninput="validate()" id="from-input" placeholder="Enter City Name">
                                        <span class="error" id="from-error"></span>
                                    </div>
                                    <div class="col-4">
                                        <label for="">Date Of Travel:</label>
                                        <input type="date" class="form-control" oninput="validate()" id="dot-input" placeholder="Enter Your Date">
                                        <span class="error" id="dot-error"></span>
                                    </div>
                                    <div class="col-4">
                                        <label for="">To :</label>
                                        <input type="text" class="form-control" oninput="validate()" id="to-input" placeholder="Enter City Number">
                                        <span class="error" id="to-error"></span>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <label for="">Age :</label>
                                        <input type="number" class="form-control" oninput="validate()" id="age-input" placeholder="Enter Your Age">
                                        <span class="error" id="age-error"></span>
                                    </div>
                                    <div class="col-6">
                                        <label for="">Preferred Seat :</label>
                                        <select name="" id="ps-input" oninput="validate()" class="form-control">
                                            <option value="None">None</option>
                                            <option value="Seater">Seater</option>
                                            <option value="Sleeper">Sleeper</option>
                                        </select>
                                        <span class="error" id="ps-error"></span>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col">
                                        <label for="">Address :</label>
                                        <textarea name="" rows="4" id="address-input" oninput="validate()" class="form-control" placeholder="Enter Your Address"></textarea>
                                        <span class="error" id="address-error"></span>
                                    </div>
                                </div>
                                <div class="row button-row">
                                    <div class="col button-col mt-4">
                                        <button class="btn submit-btn" type="submit">Submit</button>
                                        <button class="btn reset-btn" type="reset">Reste</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div class="show-details" id="output">
                            <h5 class="text-center heading">Passenger Details</h5>
                            <div class="row show-details-row">
                                <div class="col-4 show-details-col-1">
                                    <h5>Name :</h5>
                                    <h5>Email :</h5>
                                    <h5>Phone Number :</h5>
                                    <h5>From :</h5>
                                    <h5>To :</h5>
                                    <h5>Gender :</h5>
                                    <h5>Age :</h5>
                                    <h5>Date Of Travel :</h5>
                                    <h5>Preferred Seat :</h5>
                                    <h5>Seat Number :</h5>
                                    <h5>Address :</h5>
                                </div>
                                <div class="col-8 show-details-col-2">
                                    <p class="entername" id="fullname"></p>
                                    <p class="entername" id="email"></p>
                                    <p class="entername" id="phonenumber"></p>
                                    <p class="entername" id="from"></p>
                                    <p class="entername" id="to"></p>
                                    <p class="entername" id="gender"></p>
                                    <p class="entername" id="age"></p>
                                    <p class="entername" id="dateoftravel"></p>
                                    <p class="entername" id="preferredseat"></p>
                                    <p class="entername" id="seatnumber"></p>
                                    <p class="entername" id="address"></p>
                                </div>
                                <div class="buttons text-center mt-4">
                                    <button class="btn  back-btn" onclick="back()">Back</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    

    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</body>
</html>
